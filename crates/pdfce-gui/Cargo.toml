[package]
name = "pdfce-gui"
description = "pdfce native desktop shell (egui/eframe). The GUI binary. Depends on pdfce-core (+ pdfce-render from the Pass that needs rendering). Pass 0 scope: window + Open-File header probe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pdfce-gui"
path = "src/main.rs"

[features]
# Forwarded strippable capabilities — see `pdfce-core`'s Cargo.toml for the
# convention and why forwarding through EVERY crate is mandatory.
#
# This block exists because its absence was a live regression for the length
# of one commit: the workspace root sets `default-features = false` on
# `pdfce-core` (Cargo refuses to let a member override it, so it can only be
# said there), and without a forwarding block here the GUI silently lost
# JPEG 2000 decoding entirely. `cargo tree -p pdfce-gui -i hayro-jpeg2000`
# came back EMPTY. Nothing failed to compile; the shell simply stopped being
# able to decode a codec it had shipped with all along.
#
# That is the failure mode to remember: forgetting to forward does not break
# the build, it removes a capability, and only a dependency query or a real
# JPX document reveals it.
default = ["jpx"]
jpx = ["pdfce-core/jpx", "pdfce-render/jpx"]

[dependencies]
# eframe = egui's application shell. GUI dependencies live HERE and only
# here (plus pdfce-cli's clap) — never in pdfce-core/pdfce-render
# (docs/ARCHITECTURE.md §3). MIT-OR-Apache-2.0 (permissive).
#
# Backend = glow (OpenGL), NOT the eframe default (wgpu). docs/ARCHITECTURE.md
# §2 specifies "wgpu, falls back to glow/OpenGL if needed" — and it is needed:
# the current wgpu 29 stack pulls wgpu-hal (windows-crate 0.61) and
# gpu-allocator 0.28 (windows-crate 0.62), whose D3D12 types are mutually
# incompatible, so the wgpu build fails to compile on Windows (see
# D:\dev\rag\rust for the full finding). glow is also lighter (no D3D12/
# shader-compilation stack) and entirely sufficient for pdfce's 2D egui UI,
# which is better for the single-folder-portable goal. `default-features =
# false` drops egui-wgpu/wgpu/wgpu-hal/gpu-allocator entirely. Revisit wgpu
# when that upstream stack stabilizes.
eframe = { version = "0.35", default-features = false, features = [
    "glow",         # OpenGL backend via glutin
    "default_fonts",
    "accesskit",    # native accessibility tree — a11y is a pdfce UI goal
    "wayland",      # Linux windowing; compiles to nothing on Windows
    "x11",          # Linux windowing; compiles to nothing on Windows
] }
# rfd: native file-open/save dialogs, no C dependency (docs/PRIOR_ART.md). MIT.
rfd = "0.17.2"
# egui_tiles: the tiling/docking layout engine behind the right-hand panel
# dock (docs/decisions/017-tabbed-dockable-panel-system.md, AMENDMENT A —
# the operator fired §6.1's pre-armed adoption trigger on 2026-08-02).
#
# Licence: MIT OR Apache-2.0 — permissive, so LEGAL.md §6.2 step 3 applies
# (proceed and log; no operator flag). Decision 017 §6.2's vetting stands;
# only the version-specific facts were re-verified against the release
# actually resolved here (0.16.0): `rust-version = 1.92`, pdfce's exact
# MSRV — the `main`-branch bump to 1.95 §6.2 warned about has NOT reached a
# release, so no downgrade-pin was needed; `egui ^0.35.0`, pdfce's exact
# pin; ONE new package in the shipping graph, its transitive deps (ahash,
# itertools, log) all already present at satisfying versions via
# eframe/egui/epaint.
#
# `default-features = false` is LOAD-BEARING, not tidiness: this crate's
# default feature set is `["serde"]`, which would pull `serde` in AND turn
# on `egui/serde`. Decision 017 §7 and A.6 keep panel layout SESSION-ONLY
# this Pass; persistence, when it comes, rides R15's named user-state
# partition inside the distribution folder, never eframe's platform
# app-data Storage (which would contradict decision 003's
# single-folder-portable posture). Enabling the feature now would add
# packages for a capability deliberately not shipped.
#
# GUI-core separation (CLAUDE.md rule 2, ARCHITECTURE.md §3): this is a
# `pdfce-gui`-only dependency and must stay one —
# `pdfce-core`/`pdfce-render`/`pdfce-cli` must never acquire it.
egui_tiles = { version = "0.16.0", default-features = false }
pdfce-core.workspace = true
# pdfce-render: added at Pass 1, the Pass that first draws a page. The GUI
# consumes exactly the same headless rasterizer `pdfce-cli render-page` does
# — the shell decides where pixels GO, never how they are made
# (docs/ARCHITECTURE.md §3). Note the direction of the dependency: the GUI
# depends on the renderer, never the other way round, which is the whole
# invariant CI's `cargo tree` job checks.
#
# `egui` and `tiny_skia` are deliberately NOT direct dependencies here: egui
# is reached through `eframe`'s re-export and tiny-skia through
# `pdfce-render`'s, so neither can drift to a version incompatible with the
# crate that actually produces the values we consume.
pdfce-render.workspace = true
pdfce-print.workspace = true
