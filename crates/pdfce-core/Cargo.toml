[package]
name = "pdfce-core"
description = "pdfce PDF engine core: COS object model, parser, writer, filters, fonts, and crypto. GUI-agnostic — zero windowing dependencies (docs/ARCHITECTURE.md §3). Pass 0 scope: header-probe only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# thiserror: the ecosystem-standard derive for well-behaved error types
# (Rust API Guidelines C-GOOD-ERR — errors implement std::error::Error and
# are Send + Sync + 'static). License: MIT OR Apache-2.0 (permissive, no
# user flag required per docs/LEGAL.md §6). Added via `cargo add`.
thiserror = "2"

# flate2: FlateDecode (ISO 32000-1 §7.4.4 delegates to RFC 1950/1951 zlib).
# PURE-RUST BACKEND ONLY (`rust_backend` = miniz_oxide; default-features
# off): the C zlib/zlib-ng backends would break the static-single-binary
# packaging invariant (ARCHITECTURE.md §6) and the WASM fork — this is the
# dependency selected by docs/decisions/001-oxidize-pdf-adopt-vs-build.md
# §6.2 and PRIOR_ART.md; never switch backends without a decision-log
# entry. License: MIT OR Apache-2.0 (permissive per docs/LEGAL.md §6).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# --- Pass 2.1 -------------------------------------------------------
#
# zune-jpeg: DCTDecode (§7.4.8), the highest-value single codec —
# 82% of measured unimplemented-filter instances in the 2,914-file
# corpus (decision 005 §3.1). License MIT OR Apache-2.0 OR Zlib.
#
# default-features = false IS LOAD-BEARING, NOT TIDINESS (R24).
# zune-jpeg's lib.rs carries:
#   #![cfg_attr(not(any(feature = "x86", feature = "neon")),
#               forbid(unsafe_code))]
# so dropping the SIMD features makes the decoder COMPILER-ENFORCED
# zero-unsafe. All 96 unsafe occurrences live in 14 SIMD files that do
# not compile in this configuration. `std` is kept: pdfce-core is a std
# crate and wasm32-unknown-unknown supports std.
#
# Verified present in 0.5.15: progressive (14% of corpus JPEGs),
# restart intervals (74%), Adobe APP14 transform 0/1/2, the
# 3-component/transform-0 CMYK->RGB fixup, decode_headers() +
# output_buffer_size() + decode_into() for bounded decode, and
# DecoderOptions max_width/max_height/max_scans.
# NOT supported, and each a NAMED diagnostic per R27: arithmetic
# coding, lossless, 12-bit, and the YCCK->CMYK conversion (pdfce does
# that one itself from a YCCK passthrough).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# weezl: LZWDecode (§7.4.4 + TIFF 6.0 §13). MIT OR Apache-2.0,
# #![forbid(unsafe_code)], zero required deps, 5 cargo-fuzz targets.
# /EarlyChange maps to the constructor and nothing else:
#   EarlyChange 1 (DEFAULT) -> Decoder::with_tiff_size_switch(Msb, 8)
#   EarlyChange 0           -> Decoder::new(Msb, 8)
# BitOrder::Msb is mandatory — GIF's Lsb packing is a different codec.
# decode_bytes(inp, out) is what makes MAX_DECODED_LEN enforceable
# INCREMENTALLY, as filters/mod.rs already promises for Flate.
#
# NOTE on weezl's ENCODER: it is compiled in (weezl has no decoder-only
# feature) and is used in `#[cfg(test)]` ONLY, to build known-good LZW
# fixtures for the round-trip tests. pdfce never writes LZW — R28.
weezl = "0.2"

# --- Pass 2.2 -------------------------------------------------------
#
# hayro-ccitt: CCITTFaxDecode (§7.4.6, ITU-T T.4/T.6).
# Apache-2.0 OR MIT, ZERO dependencies, unconditional #![no_std],
# #![forbid(unsafe_code)] + #![forbid(missing_docs)].
# Chosen over `fax` (MIT, 35M downloads, also credible) because its
# DecodeSettings maps 1:1 onto Table 11 — columns/rows/encoding/
# end_of_block/end_of_line/rows_are_byte_aligned/invert_black — which
# keeps the K-sign trichotomy and the BlackIs1 polarity inside a fuzzed
# dependency instead of in our glue. `fax` stays the named fallback.
hayro-ccitt = { version = "0.3", default-features = false }

# hayro-jbig2: JBIG2Decode (§7.4.7, ITU-T T.88). Apache-2.0 OR MIT,
# #![forbid(unsafe_code)]. Image::new_embedded() IS the /JBIG2Globals
# path (Table 12) — no general-purpose JBIG2 decoder exposes it.
# default = ["std","image","simd"]; `image` pulls the image crate and
# `simd` pulls fearless_simd. BOTH OFF (R24).
# The alternatives were all GPL-3.0 C FFI bindings to Artifex jbig2dec,
# untouched since 2020 — see decision 005 §3.5.
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }

# --- Pass 2.3 -------------------------------------------------------
#
# hayro-jpeg2000: JPXDecode (§7.4.9, ITU-T T.800). Apache-2.0 OR MIT,
# unsafe forbidden crate-level. THE ONLY credible pure-Rust JPEG2000
# decoder — 550k downloads vs ~1.9k for the nearest pure-Rust rival;
# everything else in the space wraps OpenJPEG in C.
# Its ColorSpace::{Gray,RGB,CMYK,Unknown{n},Icc{profile,n}} is exactly
# the shape §8.9.5 Table 89 needs, where the CODESTREAM's colour space
# overrides the dict and /BitsPerComponent is ignored if present.
# MSRV 1.92 — identical to pdfce's, with zero headroom.
#
# VERIFIED at adoption (0.4.0, read from the pinned registry source):
#   src/lib.rs:68  #![forbid(unsafe_code)] — UNCONDITIONAL, not a
#                  cfg_attr like zune-jpeg's; the `simd` feature adds
#                  fearless_simd as a DEPENDENCY, so R24's job here is
#                  keeping that dependency out rather than restoring an
#                  attribute. `image` (off) would pull the image crate
#                  AND moxcms.
#   Image::new     accepts BOTH a JP2 box container and a bare
#                  codestream, sniffed from the first bytes. §7.4.9
#                  mandates the container shape; real producers emit
#                  both, so this is load-bearing rather than a bonus.
#   has_alpha()    reads the JP2 `cdef` box — the hook /SMaskInData
#                  (Table 89) acts on.
# NOT supported, each a NAMED diagnostic per R27: unhandled marker
# segments, of which upstream's own documented gap is progression order
# changes in tile-parts (the POC marker) — see image_codec/jpx.rs's
# error mapping. Note also that its DecodedImage::data_u8() helper is
# deliberately NOT used: it interleaves the opacity channel into the
# colour samples (which /SMaskInData requires us to keep separate) and
# its scaling path shifts by a bit depth a JP2 palette box may declare
# as large as 128.
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std"] }

# --- Pass 46.x: the JPEG ENCODER (image_import's ImageCompression::Jpeg) ----
#
# jpeg-encoder: writes /DCTDecode (§7.4.8) for
# `image_import::ImageCompression::Jpeg { quality }`. THE FIRST ENCODER in
# the project — R28 forbade one entering without a dated decision, and the
# operator gave that ruling on 2026-08-08 ("accept the ijg attribution
# line").
#
# LICENSE: `(MIT OR Apache-2.0) AND IJG`. Read that conjunction carefully —
# it is the reason this dependency needed an operator decision rather than a
# routine `cargo add`:
#   * `MIT OR Apache-2.0` covers vstroebel's own Rust code (permissive,
#     nothing to do beyond the usual notice).
#   * `AND IJG` is NOT an alternative. It is an ADDITIONAL, simultaneously
#     binding licence, inherited because the quantization/Huffman tables and
#     the FDCT are derived from the Independent JPEG Group's libjpeg. IJG is
#     permissive (no source-disclosure obligation, so nothing here touches
#     pdfce's own MIT licence — LEGAL.md §6.1), but it carries a real
#     ATTRIBUTION obligation on BINARY redistribution: the sentence
#         "this software is based in part on the work of the
#          Independent JPEG Group"
#     must appear in the documentation shipped with the binary.
#   * That sentence is NOT generated by `cargo-about` — it lists the licence
#     text, not the required acknowledgement. It therefore lives as a STATIC
#     section in `about.hbs` (the cargo-about template), so every
#     regeneration of THIRD_PARTY_LICENSES.md re-emits it and no dependency-
#     set change can drop it. `IJG` is also added to about.toml's `accepted`
#     list — without it `cargo about generate` fails, which is the audit
#     working as designed (LEGAL.md §6.3).
# This is pdfce's FIRST conjunctive-attribution (`AND`) dependency; every
# prior one was a pure `OR` of permissive licences.
#
# default-features = false IS LOAD-BEARING, NOT TIDINESS (R24), and for the
# same compiler-enforced reason as zune-jpeg above. jpeg-encoder's lib.rs
# carries:
#     #![no_std]
#     #![cfg_attr(not(feature = "simd"), forbid(unsafe_code))]
# so leaving `simd` OFF keeps the encoder COMPILER-ENFORCED zero-unsafe.
# The crate's own default is ["std"]; `std` is kept (pdfce-core is a std
# crate and wasm32-unknown-unknown supports std) and `simd`/`benchmark` are
# not enabled. Enabling `simd` would trade the `forbid(unsafe_code)` posture
# for x86 AVX2 throughput — do not do it without a decision-log entry.
#
# ZERO dependencies (verified in the pinned 0.7.1 manifest: an empty
# [dependencies] table; jpeg-decoder appears only as a dev-dependency).
# MSRV 1.87, comfortably under pdfce's 1.92. Pure Rust, so the
# static-single-binary packaging invariant (ARCHITECTURE.md §6) and the WASM
# fork both survive — which is exactly why the C-linked alternatives
# (mozjpeg, turbojpeg) were rejected, quite apart from their licences.
#
# VERIFIED at adoption by reading the pinned registry source, because the
# CMYK polarity trap of decision 006 lives right here (encoder.rs:571-580,
# image_buffer.rs:232-286):
#   ColorType::Cmyk        -> writes APP14 with transform byte 0 AND stores
#                             `255 - input` on all four channels.
#   ColorType::CmykAsYcck  -> writes APP14 with transform byte 2 and stores
#                             `cmyk_to_ycck(p) = (rgb_to_ycbcr(p0,p1,p2),
#                             255 - p3)`.
# BOTH decode, under the never-invert four-engine consensus (R29), to
# `255 - input`. pdfce therefore feeds the COMPLEMENT of its true-ink CMYK
# samples into `CmykAsYcck`, which reproduces TN #5116 §13.1 exactly
# (`rgb_to_ycbcr(255-C, 255-M, 255-Y)` with K passed through) and lands on
# the transform-2 shape decision 006 verified pixel-perfect against pdfium.
# See `image_import/jpeg_encode.rs` for the full argument and the tests that
# assert it in SAMPLE VALUES.
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
