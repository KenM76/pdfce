[package]
name = "pdfce-render"
description = "pdfce headless rasterizer: turns pdfce-core draw-ops into pixels (planned: tiny-skia, Pass 1). GUI-agnostic — zero windowing dependencies. Pass 0 scope: stub only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Render instrumentation for `tools/render-profile`. OFF by default and
# compiled out entirely: without it `profile`'s counters are absent and
# its note_* calls have empty bodies, so a shipping build carries no
# atomic and no branch. See `src/profile.rs` for why it is permanent
# rather than throwaway.
profile = []

# ---------------------------------------------------------------------------
# FORWARDED STRIPPABLE CAPABILITIES — and why forwarding is MANDATORY, not
# tidiness.
#
# Cargo unifies features across the whole graph: if ANY crate depends on
# `pdfce-core` with default features on, the feature is enabled for every
# consumer, no matter what the others ask for. Measured on 2026-08-12 —
# `cargo build -p pdfce-cli --no-default-features` produced a binary
# BYTE-IDENTICAL to the full one, because this crate was still pulling
# `pdfce-core` with defaults and re-enabling `jpx` behind the CLI's back.
#
# So every intermediate crate must (a) take `pdfce-core` with
# `default-features = false` and (b) re-export each capability it wants to
# forward. A crate that forgets silently defeats stripping for the entire
# workspace, and the symptom is a flag that appears to work and changes
# nothing.
default = ["jpx", "ocrs"]
jpx = ["pdfce-core/jpx"]
# The `ocrs` text-recognition engine. Forwarded even though `pdfce-render`
# never calls it: the CLI reaches core THROUGH this crate, so a missing rung
# here would strip OCR from the CLI with no diagnostic anywhere.
ocrs = ["pdfce-core/ocrs"]

[dependencies]
# Depends on pdfce-core plus the CPU rasterizer. NOTHING here may pull a
# GUI/windowing crate — see docs/ARCHITECTURE.md §3.
pdfce-core.workspace = true
# thiserror: error-type derive, same rationale + license (MIT OR Apache-2.0)
# as pdfce-core's entry.
thiserror = "2"

# tiny-skia: the Pass 1 rasterizer backend (docs/PRIOR_ART.md selection,
# reaffirmed by docs/decisions/001 §6.2): pure-Rust CPU path renderer,
# proven via resvg, no GPU/windowing surface, WASM-clean. License:
# BSD-3-Clause (permissive per docs/LEGAL.md §6; attribution lands in the
# regenerated THIRD_PARTY_LICENSES.md).
tiny-skia = "0.11"

# skrifa: the single font-program parser for the READ path (decision
# 004 R21). License MIT OR Apache-2.0, #![forbid(unsafe_code)], pure
# Rust, no_std-capable — wasm32-clean per decision 003 R11, no
# GUI/windowing surface per ARCHITECTURE.md §3.
#
# Covers all four PDF font-program cases through ONE dependency:
#   FontFile2  (sfnt)        -> skrifa::FontRef + OutlineGlyphCollection
#   FontFile3  (bare CFF)    -> skrifa::raw::ps::cff::CffFontRef
#   FontFile   (bare Type 1) -> skrifa::raw::ps::type1::Type1Font
#   explicit cmap / post     -> skrifa::raw::tables::{cmap, post}
#
# VERSION PIN IS LOAD-BEARING (decision 004 §3.4). skrifa 0.42.x /
# read-fonts 0.39.x are ALREADY in Cargo.lock via epaint 0.35, so
# "0.42" adds ZERO packages. Upstream is at 0.45; declaring that would
# link a SECOND semver-incompatible copy of the whole fontations stack
# beside epaint's. When egui bumps skrifa, bump this in the same
# commit — the `cargo tree --duplicates` CI guard says so if not.
#
# Do NOT enable read-fonts' `agl` feature: pdfce-core owns the single
# Adobe Glyph List, sourced BSD-3-Clause (decision 004 §5.6).
skrifa = "0.42"

# subsetter: the write-side font subsetter (decision 021 / FF-C, Pass 21.x).
# Typst's, purpose-built for PDF embedding. MIT OR Apache-2.0, and every
# crate in its transitive graph is permissive — classified per rule 13
# before adding, see docs/PRIOR_ART.md "FF-C dependency classification".
#
# WHY IT LIVES IN pdfce-render AND NOT pdfce-core (decision 021 §3.2).
# Subsetting is a WRITE concern, so `pdfce-core` looks like the obvious
# home. It is not. Producing a subset first requires PARSING the donor —
# cmap lookup for coverage, `hmtx` for advances, `head`/`post`/`OS/2` for
# the descriptor and the embedding-permission bits — and that parser
# already exists here, in `font/program.rs`. Putting `subsetter` in core
# would add a SECOND font parser to a crate that has none today (its
# `fontdata/` is compiled metrics only) purely to avoid a plain-data seam.
# So: this crate produces a `FontEmbedPlan`; `pdfce-core` defines that type
# and emits the PDF objects from it. `pdfce-core` gains nothing.
#
# This does NOT contradict R21 ("one font parser"). R21 is scoped to the
# READ path and carries its own clause — "No second parser enters without
# a new decision record" — which decision 021 is. `subsetter`'s internal
# reader never renders a glyph, never picks a substitute, and never
# reaches `Diagnostics`; it reads in order to rewrite, and if its output
# is ever displayed it is skrifa that re-reads it.
#
# `default-features = false` IS LOAD-BEARING, NOT TIDINESS (R24), and it
# is load-bearing twice over here:
#
#   1. The default feature is `variable-fonts`, which exists solely to
#      instance VARIABLE fonts at non-default axis coordinates. pdfce does
#      not need that at P0.
#   2. Enabling it pulls `write-fonts` — fine at the 0.48 line `subsetter`
#      pins, but a bare `cargo add write-fonts` selects 0.51, which wants
#      `read-fonts 0.42` and would put a SECOND semver-incompatible
#      fontations stack beside epaint's. That is the exact hazard the
#      skrifa comment above describes, reachable through a feature flag.
#
# With the feature off this adds exactly ONE package to the workspace
# lock: `subsetter` itself. Its only non-optional dependency, `rustc-hash`,
# is already present via `type-map` <- eframe. Verified by `cargo metadata`
# on a scratch crate carrying both `subsetter` and `skrifa = "0.42"`:
# a single `read-fonts 0.39.2`, a single `font-types 0.11.3`.
subsetter = { version = "0.2", default-features = false }

[dev-dependencies]
# flate2: TEST-ONLY. The image tests need a genuinely Flate-encoded
# sample stream to prove the image path runs the /Filter chain rather
# than assuming raw bytes; hand-rolling a zlib container in the test
# would prove less and read worse. Already in Cargo.lock via
# pdfce-core's (non-dev) dependency with the identical pure-Rust
# backend, so this adds ZERO packages and cannot reach the shipped
# graph — dev-dependencies are excluded from `cargo tree` for a normal
# build and from cargo-about's THIRD_PARTY_LICENSES.md (docs/LEGAL.md
# §6.3). License: MIT OR Apache-2.0 (permissive).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
