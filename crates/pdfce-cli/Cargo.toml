[package]
name = "pdfce-cli"
description = "pdfce command-line batch shell: scriptable merge/split/stamp/convert/sign/validate over pdfce-core. Zero GUI dependencies (docs/ARCHITECTURE.md §7). Pass 0 scope: clap scaffold + `inspect`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pdfce-cli"
path = "src/main.rs"

[dependencies]
# clap (derive API): the de facto standard argument parser
# (docs/PRIOR_ART.md). License: MIT OR Apache-2.0 (permissive). Zero GUI
# deps — this crate holds the CLI-front-end half of the "two front ends,
# one shared core" proof (docs/ARCHITECTURE.md §7).
clap = { version = "4", features = ["derive"] }
pdfce-core.workspace = true
# pdfce-render: added at Pass 1, the Pass that first needs it — `render-page`
# rasterizes through exactly the same headless code path `pdfce-gui` displays
# from and the future WASM fork will reuse (docs/ARCHITECTURE.md §3/§7). This
# is the second half of the "two front ends, one shared core" proof: the CLI
# renders pages without linking a single windowing crate, which CI's
# `cargo tree` denylist verifies.
#
# PNG encoding comes with it, at zero manifest cost: pdfce-render depends on
# tiny-skia with default features, which include `png-format`, which is what
# provides `Pixmap::encode_png`. The `png` crate that backs it is already in
# `Cargo.lock` via that path — MIT OR Apache-2.0, permissive per
# docs/LEGAL.md §6.1, already covered by the generated
# THIRD_PARTY_LICENSES.md. No new package enters the graph for this Pass.
pdfce-render.workspace = true

# Windows printing (Reader-parity sweep). TARGET-GATED so the Linux and
# macOS CI jobs still compile this crate — printing is the one genuinely
# platform-bound capability in the CLI, and v1 ships Windows-only
# (decision 003 §4.1) while the codebase stays platform-clean (R10).
#
# NOT a new licensing question: the `windows` crate is ALREADY in the
# workspace tree at 0.62 via eframe/winit, MIT-OR-Apache-2.0, and already
# listed in THIRD_PARTY_LICENSES.md. Verified with `cargo tree` before
# adding rather than assumed (rule 13).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    # PRINTER_INFO_2W embeds a SECURITY_DESCRIPTOR pointer, so the struct
    # is feature-gated behind Win32_Security even though pdfce never reads it.
    "Win32_Security",
    "Win32_Storage_Xps",
] }
