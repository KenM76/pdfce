# pdfce CI
#
# NOTE (2026-07-23): this workflow is scaffolded ahead of the Cargo
# workspace it gates — pdfce is pre-Pass-0 as of this commit, so
# `pdfce-core`/`pdfce-render`/`pdfce-gui`/`pdfce-cli` don't exist yet.
# It targets the workspace layout documented in docs/ARCHITECTURE.md
# §3 and will start actually running (rather than erroring on missing
# packages) once Pass 0 creates the workspace. This is expected, not a
# bug — see docs/ROADMAP.md Pass 0 acceptance criteria. Nothing has
# been pushed to a hosted remote yet, so no failing run is visible
# anywhere until that changes.
#
# Every job here corresponds to a binding rule in
# .claude/agents/pdfce-engineer.md and docs/ROADMAP.md's Standing
# rules — this is the automated enforcement for what was previously
# an honor-system, self-checked-each-session set of rules.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features

  gui-core-separation:
    name: verify pdfce-core / pdfce-render have zero GUI deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # See docs/ARCHITECTURE.md §3 invariant: pdfce-core and
      # pdfce-render must never depend on egui/eframe/winit/wgpu (a
      # headless CPU rasterizer like tiny-skia is fine — it's not a
      # windowing/GUI-toolkit crate). This is what keeps the future
      # WASM/web fork a shell-crate swap instead of a rewrite.
      - name: cargo tree -p pdfce-core (fail on GUI/windowing deps)
        run: |
          set -e
          if cargo tree -p pdfce-core 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
            echo "::error::pdfce-core has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
            exit 1
          fi
      - name: cargo tree -p pdfce-render (fail on GUI/windowing deps)
        run: |
          set -e
          if cargo tree -p pdfce-render 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
            echo "::error::pdfce-render has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
            exit 1
          fi

  # Enable once the workspace has its first real Cargo dependency and
  # about.toml exists (see docs/LEGAL.md §6.3) — not added yet because
  # there is nothing to generate attribution for until then. Tracked
  # in docs/ROADMAP.md; don't forget to add this job at that point:
  #
  # third-party-licenses:
  #   name: THIRD_PARTY_LICENSES.md is up to date
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo install cargo-about
  #     - run: cargo about generate about.hbs > THIRD_PARTY_LICENSES.md
  #     - run: git diff --exit-code THIRD_PARTY_LICENSES.md
