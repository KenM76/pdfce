# pdfce CI
#
# NOTE (2026-07-23): this workflow is scaffolded ahead of the Cargo
# workspace it gates — pdfce is pre-Pass-0 as of this commit, so
# `pdfce-core`/`pdfce-render`/`pdfce-gui`/`pdfce-cli` don't exist yet.
# It targets the workspace layout documented in docs/ARCHITECTURE.md
# §3 and will start actually running (rather than erroring on missing
# packages) once Pass 0 creates the workspace. This is expected, not a
# bug — see docs/ROADMAP.md Pass 0 acceptance criteria. Nothing has
# been pushed to a hosted remote yet, so no failing run is visible
# anywhere until that changes.
#
# Every job here corresponds to a binding rule in
# .claude/agents/pdfce-engineer.md and docs/ROADMAP.md's Standing
# rules — this is the automated enforcement for what was previously
# an honor-system, self-checked-each-session set of rules.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all --check
      # `cargo fmt --all` formats WORKSPACE MEMBERS only, so every crate in
      # Cargo.toml's `exclude` list (the difftest oracle, the corpus sweep
      # tools, the fuzz harness) is unreachable by the step above — not
      # exempt from project rule 10, just invisible to the command that
      # enforces it. On 2026-08-12 that gap held unformatted code in eight
      # crates, and one crate that was in neither `members` nor `exclude` and
      # so was invisible to every workspace-wide gate at once.
      - run: python3 tools/check-fmt-excluded.py
      # Non-Cargo files pdfce REDISTRIBUTES (fonts, icons, and — once the
      # engine choice lands — OCR model weights) carry licence obligations
      # that `cargo-about` is structurally incapable of seeing, because it
      # reads Cargo.lock and nothing else. This is the only thing that checks
      # them. See tools/check-shipped-assets.py for why a gap between two
      # tools is where an obligation goes missing without anyone deciding to
      # drop it.
      - run: python3 tools/check-shipped-assets.py

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - run: cargo test --workspace --all-features
      # THE STRIPPABLE-CAPABILITY GATE.
      #
      # `pdfce-core` declares default-ON features for capabilities that can be
      # compiled out to make lighter builds (see its Cargo.toml). Nothing else
      # exercises the switched-OFF path, so without this step a `cfg` rots the
      # moment someone adds code inside a gated module that a lite build cannot
      # compile — and nobody finds out until they try to make one.
      #
      # Measured 2026-08-12: dropping `jpx` takes ~310 KB off pdfce-cli. The
      # gate has to keep working for that to stay true.
      - run: cargo test -p pdfce-core --no-default-features
      # THE FORWARDING GUARD — the other half of the gate above.
      #
      # Cargo will not let a member override an inherited `default-features`,
      # so the workspace root sets `default-features = false` on pdfce-core
      # and every consumer re-enables what it wants. A crate that forgets its
      # forwarding block does NOT fail to build — it silently loses the
      # capability. That happened to pdfce-gui for the length of one commit on
      # 2026-08-12: `cargo tree -p pdfce-gui -i hayro-jpeg2000` came back
      # empty and nothing else complained.
      #
      # So the DEFAULT build of each shell is asserted to still contain the
      # codec. This checks a capability, not a manifest, which is why it would
      # have caught that regression.
      - name: default shell builds still carry the optional codecs
        shell: bash
        run: |
          set -e
          for p in pdfce-cli pdfce-gui pdfce-render; do
            if ! cargo tree -p $p -i hayro-jpeg2000 2>/dev/null | grep -q hayro-jpeg2000; then
              echo "::error::$p's DEFAULT build no longer contains hayro-jpeg2000 — it is missing a forwarding [features] block, so a capability was dropped silently (see pdfce-core/Cargo.toml)"
              exit 1
            fi
          done

  gui-core-separation:
    name: verify pdfce-core / pdfce-render have zero GUI deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # See docs/ARCHITECTURE.md §3 invariant: pdfce-core and
      # pdfce-render must never depend on egui/eframe/winit/wgpu (a
      # headless CPU rasterizer like tiny-skia is fine — it's not a
      # windowing/GUI-toolkit crate). This is what keeps the future
      # WASM/web fork a shell-crate swap instead of a rewrite.
      # Each crate is checked twice: once for the runner's native (Linux)
      # graph and once for the SHIPPED Windows graph — decision 003 §3.5
      # found the native-only check evaluates a different dependency tree
      # (237 crates vs 147) and could miss a Windows-only violation.
      # `cargo tree --target` is metadata-only; no installed target needed.
      - name: cargo tree -p pdfce-core (fail on GUI/windowing deps)
        run: |
          set -e
          for t in "" "--target x86_64-pc-windows-msvc"; do
            if cargo tree -p pdfce-core $t 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
              echo "::error::pdfce-core has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
              exit 1
            fi
          done
      - name: cargo tree -p pdfce-render (fail on GUI/windowing deps)
        run: |
          set -e
          for t in "" "--target x86_64-pc-windows-msvc"; do
            if cargo tree -p pdfce-render $t 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
              echo "::error::pdfce-render has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
              exit 1
            fi
          done
      # Decision 004 rule R21: pdfce-render pins skrifa to the version
      # epaint already resolves, so exactly ONE copy of the fontations
      # stack exists in the binary. Two majors appearing here means the
      # egui bump landed without bumping pdfce-render's pin in the same
      # commit — fix the pin, don't silence the guard.
      - name: cargo tree --duplicates guard (fontations + image codecs)
        run: |
          set -e
          if cargo tree --duplicates 2>/dev/null | grep -E '^(skrifa|read-fonts|font-types|zune-jpeg|zune-core|weezl|hayro-ccitt|hayro-jbig2|hayro-jpeg2000) v'; then
            echo "::error::multiple versions of the fontations stack or an image codec in the graph — a second copy doubles binary size AND means one of them is unaudited (decision 004 R21, decision 005 §6.2)"
            exit 1
          fi
      # Decision 005 rule R24: the image-codec crates are built with
      # their SIMD/unsafe features OFF, and that is a LOAD-BEARING
      # safety property rather than tidiness — zune-jpeg's lib.rs
      # carries
      #   #![cfg_attr(not(any(feature = "x86", feature = "neon")),
      #               forbid(unsafe_code))]
      # so the feature set is what decides whether pdfce's JPEG decoder
      # is compiler-enforced zero-unsafe. All 96 of its unsafe
      # occurrences live in 14 SIMD files that do not compile with those
      # features off; the hayro-* codecs behave the same way with `simd`.
      #
      # THE CHECK ASSERTS THE FEATURE STATE, NOT THE DEPENDENCY LIST.
      # That distinction is the whole point: Cargo feature unification is
      # transitive and silent, so if anything anywhere in the graph ever
      # enables the `image` crate's `jpeg` feature — which pulls
      # zune-jpeg with its defaults — pdfce's decoder quietly stops being
      # forbid(unsafe_code) with NO reviewable diff. `cargo tree -e
      # features` is the only view that shows it.
      #
      # Scoped to the codec crate names on purpose: miniz_oxide and
      # tiny-skia legitimately carry `simd` features (pre-existing, Pass
      # 1), and a blanket grep would fail on those and teach everyone to
      # ignore the check.
      #
      # Enabling any codec SIMD feature requires a NEW decision record,
      # a measurement showing it matters, and fuzz coverage of the
      # enabled path — not a CI edit.
      - name: R24 — assert codec crates have SIMD/unsafe features OFF
        run: |
          set -e
          codecs='zune-jpeg|zune-core|weezl|hayro-ccitt|hayro-jbig2|hayro-jpeg2000'
          fail=0
          for p in pdfce-core pdfce-render; do
            for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
              if cargo tree -p "$p" -e features $t 2>/dev/null \
                   | grep -E "($codecs) feature \"(x86|neon|simd|portable_simd)\""; then
                echo "::error::$p $t enables a SIMD/unsafe feature on an image-codec crate — this removes zune-jpeg's compiler-enforced forbid(unsafe_code) (decision 005 R24). Requires a NEW decision record, not a CI change."
                fail=1
              fi
            done
          done
          exit $fail
      # Decision 039: `aes` is the ONE dependency in pdfce-core whose
      # unsafe cannot be turned off by a feature. Its intrinsic backends
      # are selected on a **cfg** (`aes_backend = "soft"`), and a cfg
      # cannot be set from a dependency line — only from RUSTFLAGS or
      # .cargo/config.toml, which is global and, crucially, is NOT
      # inherited by anyone consuming pdfce-core as a library. So the
      # hardware backend was accepted deliberately rather than forced
      # off with a guarantee that would be true for pdfce's own builds
      # and false for every downstream consumer.
      #
      # THE EXCEPTION IS BOUNDED TO EXACTLY THAT. This check asserts the
      # two things still under our control:
      #
      #   - `hazmat` stays OFF. It exposes raw round functions with no
      #     key schedule, exists for building other ciphers, and nothing
      #     in pdfce needs it. It is the only feature that widens the
      #     unsafe surface beyond backend dispatch.
      #   - `zeroize` stays OFF, and that is a considered choice rather
      #     than an omission: `FileKey` holds the file encryption key in
      #     an ordinary `Vec<u8>`, so zeroizing only the cipher's round
      #     keys would be theatre. If key-material hygiene is ever taken
      #     seriously it must start at `FileKey`, and this line should
      #     be revisited in that same change, not before.
      #
      # Turning either on requires a new decision record, same bar as
      # R24 itself.
      - name: decision 039 — assert `aes` carries no extra features
        run: |
          set -e
          fail=0
          for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
            if cargo tree -p pdfce-core -e features $t 2>/dev/null \
                 | grep -E 'aes feature "(hazmat|zeroize)"'; then
              # No backticks around 'aes' here: inside a double-quoted shell
              # string they are COMMAND SUBSTITUTION, so bash runs `aes`,
              # splices its empty output, and prints "on the  crate" -- the
              # message loses the one word it exists to say. It fires only on
              # failure, so it would have stayed broken until the day someone
              # needed it.
              echo "::error::pdfce-core $t enables an extra feature on the aes crate. Decision 039 accepted ONLY the intrinsic backend (which is cfg-selected and cannot be disabled per-dependency); hazmat/zeroize are separate widenings and need a new decision record."
              fail=1
            fi
          done
          exit $fail
      # Decision 039 EXTENDED — `sha2`, added for AES-256 at /R 5 (encryption
      # increment 3). Not a new decision: `sha2` has the SAME SHAPE as `aes`
      # and is covered by 039's recorded exception rather than needing its own.
      #
      #   - Its backends are selected on a **cfg** too --
      #     `sha2_backend` / `sha2_256_backend` / `sha2_512_backend`, declared
      #     in its own `[lints.rust.unexpected_cfgs] check-cfg` -- so exactly
      #     as with `aes`, a dependency line cannot force the soft backend and
      #     a `.cargo/config.toml` that did would not be inherited by anyone
      #     consuming pdfce-core as a library. Five `unsafe` sites, all in
      #     `sha256.rs`'s backend dispatch.
      #   - It does NOT enable `hazmat` or `zeroize` on `aes`, so 039's
      #     existing boundary is untouched by its arrival. (`digest`'s
      #     `block-api` feature IS enabled -- by sha2 itself, unconditionally,
      #     as its own dependency. That is not a feature pdfce selects and not
      #     one it can turn off.)
      #
      # THE EXCEPTION IS BOUNDED TO EXACTLY THAT, and this asserts the three
      # things still under our control. `sha2`'s default feature set is
      # ["alloc", "oid"]; pdfce takes it with `default-features = false`, so
      # all three below are OFF and must stay off:
      #
      #   - `alloc` / `oid` are not needed: pdfce calls `Sha256::new`,
      #     `update` and `finalize` and nothing else. `oid` in particular
      #     drags in const-oid for an ASN.1 identifier no PDF path uses.
      #   - `zeroize` stays OFF for the SAME reason it does on `aes`, and the
      #     reason is stronger here rather than weaker: `FileKey` holds the
      #     file encryption key in an ordinary `Vec<u8>`, and at /R 5 the
      #     SHA-256 output IS a key-unwrapping key. Zeroizing the hash state
      #     while the key it produced sits in a plain Vec would be theatre.
      #     Revisit at `FileKey`, in the same change, or not at all.
      - name: decision 039 (extended) — assert `sha2` carries no extra features
        run: |
          set -e
          fail=0
          for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
            if cargo tree -p pdfce-core -e features $t 2>/dev/null \
                 | grep -E 'sha2 feature "(alloc|oid|zeroize)"'; then
              # Same no-backticks rule as the step above, and for the same
              # reason: this string is double-quoted, so a backtick would run
              # the enclosed word as a command and silently delete it from the
              # message. The comment is repeated rather than cross-referenced
              # because the mistake is made while typing THIS line.
              echo "::error::pdfce-core $t enables an extra feature on the sha2 crate. Decision 039 (extended to sha2) accepted ONLY the cfg-selected intrinsic backend; alloc/oid/zeroize are separate widenings and need a new decision record."
              fail=1
            fi
          done
          exit $fail

  ui-strings:
    name: verify pdfce-gui strings live in ui_text.rs
    runs-on: ubuntu-latest
    steps:
      # ★ FULL HISTORY REQUIRED, and its absence was SILENT.
      #
      # `check-commits-filed.py` walks every commit and skips the ones that
      # only touch `docs/`. actions/checkout defaults to `fetch-depth: 1` —
      # a ONE-COMMIT clone. A shallow boundary commit has no parent to diff
      # against, so git reports it as adding every file in the tree, and a
      # docs-only filing commit was therefore classified as a CODE commit
      # and reported unfiled.
      #
      # The gate did not error. It printed a confident, specific, WRONG
      # list, and it had been doing so for as long as this job has existed.
      # Reproduced locally with `git clone --depth 1` before fixing —
      # byte-identical output to the CI failure.
      #
      # The script now also refuses to run on a shallow clone rather than
      # trusting this line to stay correct.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Decision 002 rule R1: every operator-visible string in pdfce-gui
      # lives in ui_text.rs. The rule now lives in tools/check-ui-strings.sh
      # so it can be RUN LOCALLY before pushing — see that script's header
      # for the exclusions and the reasoning behind each.
      #
      # This job was previously an inline grep that FAILED AT BASELINE on 140
      # hits, and had for some time. A gate that cannot pass enforces nothing
      # and teaches everyone who sees it red to ignore it — and in this case
      # the noise was concealing a genuine violation (the Measure sub-tool
      # names, drawn on the toolbar, living as bare literals in main.rs).
      # 125 of the 140 were test assertion messages; three of the remainder
      # were the regex misreading Rust, matching from one literal's closing
      # quote to the next literal's opening quote.
      - name: check that operator-visible strings live in ui_text.rs
        run: bash tools/check-ui-strings.sh

      # ARCHITECTURE.md 4.1(P): a field carrying a DISCLOSURE OBLIGATION is
      # assigned only inside its own traced setter, so every note that
      # reaches the operator also reaches the observation harness.
      #
      # Runs beside the string gate because it guards the same surface from
      # the other side: R1 asks whether the words live where they can be
      # reviewed; this asks whether they can be SEEN to have been said.
      #
      # The rule it enforces was broken at 34 sites and nobody noticed,
      # because the failure mode of a disclosure channel with no trace is
      # that "fired" and "never fired" look identical. See the script's
      # header for how it was found.
      - name: check the disclosure channel goes through its traced setter
        run: bash tools/check-disclosure-channel.sh

      # Every CODE commit is named in the record. `check-passes-filed.py`
      # already covers commits that CLAIM a Pass ID; most claim none, and
      # for those it is blind — which is how eleven commits, including a
      # dropped-transparency fix and the removal of a third party's
      # confidential material, reached HEAD with no roadmap presence at all.
      #
      # Both times that backlog was discovered it was an accident. This is
      # the exhaustive walk that replaces the accident. See the script's
      # header for the ratchet, and why the known debt lives in a file
      # rather than in a green gate that guards nothing.
      - name: check that every code commit is filed
        run: python tools/check-commits-filed.py

  cross-check:
    name: cross-target compile check (macOS / wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,wasm32-unknown-unknown
      # WHAT THIS PROVES: the workspace type-checks for these targets.
      # WHAT IT DOES NOT PROVE: that it links, runs, or opens a window.
      # `cargo check` needs no linker and no platform SDK, which is why
      # this runs at ubuntu rates instead of macOS rates — see
      # docs/decisions/003-distribution-posture.md §3.1 and §5.3.
      # macOS is NOT a supported platform (rule R9) — this job exists to
      # keep the code portable, not to claim it runs there.
      - run: cargo check --workspace --target aarch64-apple-darwin
      # The web-fork invariant, checked positively rather than only by
      # the absence of GUI crates: pdfce-core + pdfce-render must stay
      # WASM-compilable (ARCHITECTURE.md §3, §1). pdfce-gui/pdfce-cli are
      # deliberately excluded — they are native shells.
      - run: cargo check -p pdfce-core -p pdfce-render --target wasm32-unknown-unknown

  no-network:
    name: verify the ENGINE needs no network (core + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # ARCHITECTURE.md §1.1 / decision 003 rule R12, AS NARROWED BY THE
      # OPERATOR ON 2026-08-13. Verbatim: "the no network rule was made
      # too broad. all I meant by that is the software itself didn't rely
      # on network technology to function which would bloat it and slow
      # things down the way it does for other pdf software. it is fine to
      # have download update or download addin capability."
      #
      # SO THE SUBJECT SET SHRANK FROM FOUR CRATES TO TWO, and the line
      # this job now enforces is the operator's own: what the software
      # needs to RUN, versus what the operator can ASK it to fetch.
      #
      #   ENFORCED  pdfce-core, pdfce-render -- the ENGINE. Parsing and
      #             rendering a file must never require a network, and
      #             this has a SECOND independent justification: both
      #             crates must cross into the wasm32/web fork, where a
      #             native HTTP stack does not exist.
      #   ALLOWED   pdfce-cli, pdfce-gui, tools/ -- the SHELLS. Operator-
      #             initiated fetching (model downloads, updates,
      #             add-ins) is explicitly permitted.
      #
      # WHAT THIS DOES NOT RELAX, and the distinction is the whole point:
      # no telemetry, no usage analytics, no crash reporting, no licence
      # callback, no silent phone-home. The operator narrowed ONE clause;
      # that is not consent to widen the neighbouring one. A network call
      # that happens without the operator asking still needs §1.1's
      # opt-in treatment and a decision record.
      #
      # ★ R192 -- WHAT THIS GATE CANNOT SEE, enumerated rather than
      # gestured at:
      #   - It reads the CARGO GRAPH, so it cannot see a raw socket
      #     opened through `std::net`, which needs no dependency at all.
      #     Nothing checks for that.
      #   - It cannot see a network call in a BUILD SCRIPT or proc macro
      #     (`cargo tree` without `-e build,proc-macro`).
      #   - It says nothing about the shells, BY DESIGN as of 2026-08-13
      #     -- so "CI is green" is no longer evidence that pdfce as a
      #     whole makes no network calls. It is evidence about the engine
      #     only.
      #   - It cannot distinguish an operator-initiated fetch from a
      #     silent one. That obligation is enforced by review and by the
      #     decision-record requirement, not here.
      #
      # NOT on the denylist, deliberately: `url` (a parser) and
      # `webbrowser` (hands a URL to the OS browser; unconditionally
      # linked by eframe 0.35 and not removable -- see decision 003
      # §3.4). Also not `zbus` -- the Linux accessibility D-Bus bridge, a
      # local IPC socket, which is why this check runs against the
      # SHIPPED Windows target.
      - name: cargo tree denylist (ENGINE crates, shipped target)
        run: |
          set -e
          deny='reqwest|ureq|hyper|isahc|attohttpc|curl|surf|native-tls|openssl|rustls|webpki|tokio|socket2|hickory|trust-dns'
          fail=0
          for p in pdfce-core pdfce-render; do
            if cargo tree -p "$p" --target x86_64-pc-windows-msvc 2>/dev/null \
                 | grep -Ei "(^|[[:space:]])($deny)[[:space:]]"; then
              echo "::error::$p is an ENGINE crate and has a network-client dependency. Parsing and rendering must never require a network (ARCHITECTURE.md §1.1, R12 as narrowed 2026-08-13), and both crates must compile for wasm32 where no native HTTP stack exists. The SHELLS may fetch on the operator's behalf; these two may not. Adding one here requires a NEW decision record."
              fail=1
            fi
          done
          exit $fail

  third-party-licenses:
    name: third-party license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # NOTE: the `cli` feature is REQUIRED — without it cargo-about installs
      # no binary (`cargo about` then reports "no such command"). --locked
      # keeps the tool's own build reproducible.
      - run: cargo install cargo-about --locked --features cli
        # (about.hbs also carries the hand-maintained "Embedded data & font
        # assets" epilogue — non-crate assets cargo-about can't see; see the
        # REGENERATION NOTE inside about.hbs and docs/LEGAL.md §6.3.)
      # Regenerating is itself the license audit: about.toml accepts only
      # permissive (+ bundled-font) SPDX ids, so `generate` FAILS if any
      # dependency (transitive included) carries an unaccepted copyleft
      # license — that is the gate (docs/LEGAL.md §6). We intentionally do
      # NOT `git diff --exit-code` the output: cargo-about's rendering is not
      # guaranteed byte-identical across OSes/tool versions, which would make
      # a diff check flaky. Enforcing "no unaccepted license enters the tree"
      # is the invariant that matters; keeping the committed file fresh is a
      # release-time step (docs/ARCHITECTURE.md §6).
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md

  fuzz-smoke:
    name: fuzz targets build (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/ARCHITECTURE.md §10.2: the eight cargo-fuzz targets
      # (parse_object, load_document, content_and_filters,
      # image_codec_dct, image_codec_ccitt, image_codec_jbig2,
      # image_codec_jpx, writer_roundtrip — see fuzz/fuzz_targets/*.rs
      # for the invariant each asserts) are part of Pass 1's, Pass 2.1's,
      # Pass 2.2's, Pass 2.3's and Pass 3.0's shipping criteria.
      #
      # writer_roundtrip (Pass 3.0, decision 007 R40) is the first
      # WRITE-direction target: it asserts the ARCHITECTURE.md §5
      # round-trip invariant in all three of its distinct shapes
      # (whole-file identity for an empty-dirty-set incremental save;
      # prior-bytes-intact for an append; per-object-definition identity
      # for a full rewrite). `cargo fuzz build` compiles every target in
      # fuzz/Cargo.toml, so no per-target wiring is needed here.
      #
      # BUILDING them is the CI check:
      # it proves the harnesses stay in sync with pdfce-core's API so a
      # local `cargo +nightly fuzz run <target>` always works. Actual
      # fuzz CAMPAIGNS stay manual/local — minutes-long runs in CI buy
      # little coverage and cost every push. The fuzz/ crate is
      # deliberately OUTSIDE the workspace (root Cargo.toml `exclude`),
      # so no other job compiles it — without this job, an API drift
      # would go unnoticed until someone next fuzzes locally.
      # libFuzzer needs nightly (-Z sanitizer flags), hence the
      # separate toolchain from the 1.97.1 jobs above.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
